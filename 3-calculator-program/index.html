<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class = "calculator">
            <p id = "screen">0</p> <br>
            <button class = "button" id = "zeroBtn">0</button>
            <button class = "button" id = "oneBtn">1</button>
            <button class = "button" id = "twoBtn">2</button>
            <button class = "button" id = "threeBtn">3</button><br>
            <button class = "button" id = "fordBtn">4</button>
            <button class = "button" id = "fiveBtn">5</button>
            <button class = "button" id = "sixBtn">6</button>
            <button class = "button" id = "sevenBtn">7</button><br>
            <button class = "button" id = "eightBtn">8</button>
            <button class = "button" id = "nineBtn">9</button>
            <button class = "button" id = "plusBtn">+</button>
            <button class = "button" id = "truBtn">-</button><br>
            <button class = "button" id = "nhanBtn">*</button>
            <button class = "button" id = "chiaBtn">/</button>
            <button class = "button" id = "resetBtn">AC</button>
            <button class = "button" id = "bangBtn">=</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
