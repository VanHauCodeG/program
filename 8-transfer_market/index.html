<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Online Market Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="header">
      <h2>FC Online Transfer Market</h2>
      <p>Your Balance: <span id="myMoney">500</span> Million BP</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchBox" placeholder="Search player names (e.g., Ronaldo)...">
    </div>

    <div id="playerList" class="market-grid"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
