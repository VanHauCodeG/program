<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1 class="myH1">Book Manager</h1>
        <div id="head">
            <div>
                <label class="lbl">Name</label>
                <input type="text" id="name">
            </div>
            <div>
                <label class="lbl">Author</label>
                <input type="text" id="author">
            </div>
            <button class="btn" id="btnSubmit" type="submit">Save</button>
        </div>
        <br>
        <div id="displayBox">
        </div>
    </div>
    <dialog id="editDialog">
        <h3>Update Book</h3>
        <div>
            <label>New Name:</label>
            <input type="text" id="editName">
        </div>
        <div>
            <label>New Author:</label>
            <input type="text" id="editAuthor">
        </div>
        <div style="text-align: right;">
            <button class="btnDel" id="btnCancel"
                onclick="document.getElementById('editDialog').close()">Cancel</button>
            <button class="btn" id="btnSaveUpdate">Save</button>
        </div>
    </dialog>
    <script src="script.js"></script>
</body>
<footer>
    <p class="copyright">Copyright (c) 2026 by Henry Hau. All rights reserved.</p>
</footer>

</html>
