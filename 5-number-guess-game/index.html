<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NUMBER GUESSING GAME</title>
  <link rel="stylesheet" href="index.css">
  <meta name="description" content="Giao diện trò chơi đoán số - chỉ HTML/CSS" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="wrap">
    <section class="card" role="application" aria-labelledby="game-title">
      <h1 id="game-title" class="title">NUMBER GUESSING GAME</h1>

      <p class="subtitle">The system has picked a random number between 1 and 100. Try your luck!</p>

      <div class="controls">
        <label for="guess-input" class="sr-only">Nhập số đoán</label>
        <input id="guess-input" type="number" inputmode="numeric"  placeholder="Enter a number (1 - 100)" />

        <div class="buttons">
          <button id="check-btn" class="btn primary">Check</button>
          <button id="reset-btn" class="btn ghost">Try again</button>
        </div>
      </div>

      <div class="info">
        <p id="message" class="message">Waiting for your guess..</p>

        <div class="stats">
          <div class="stat">
            <span class="label">Score</span>
            <span id="score" class="value">10</span>
          </div>
          <div class="stat">
            <span class="label">Highscore</span>
            <span id="highscore" class="value">0</span>
          </div>
        </div>
      </div>

    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
